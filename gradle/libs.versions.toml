[versions]
agp = "8.10.1"
kotlin = "2.0.21"
protobufPlugin = "0.9.5"
protoc = "4.30.2"

androidx = "1.16.0"
androidxAppCompat = "1.7.0"
androidxConstraintLayout = "2.2.1"
androidxNavigation = "2.8.9"
androidxPreference = "1.2.1"
androidXWork = "2.10.1"
eventbus = "3.3.1" # TODO: not updated since 2021
material = "1.12.0"
dexmaker = "2.28.4"
libsu = "6.0.0"
websocket = "1.6.0"
tasker = "0.4.10"
bouncycastle = "1.81"

[libraries]
androidx-core = { group = "androidx.core", name = "core", version.ref = "androidx" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "androidxAppCompat" }
androidx-constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "androidxConstraintLayout" }
androidx-navigation = { group = "androidx.navigation", name = "navigation-fragment", version.ref = "androidxNavigation" }
androidx-navigation-ui = { group = "androidx.navigation", name = "navigation-ui", version.ref = "androidxNavigation" }
androidx-preference = { group = "androidx.preference", name = "preference", version.ref = "androidxPreference" }
androidx-work-runtime = { group = "androidx.work", name = "work-runtime", version.ref = "androidXWork" }
dexmaker = { group = "com.linkedin.dexmaker", name = "dexmaker", version.ref = "dexmaker" }
dexmaker-mockito = { group = "com.linkedin.dexmaker", name = "dexmaker-mockito", version.ref = "dexmaker" }
eventbus = { group = "org.greenrobot", name = "eventbus", version.ref = "eventbus" }
libsu-core = {group = "com.github.topjohnwu.libsu", name= "core", version.ref = "libsu"}
libsu-service = {group = "com.github.topjohnwu.libsu", name= "service", version.ref = "libsu"}
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
protobuf = { group = "com.google.protobuf", name = "protobuf-java", version.ref = "protoc" }
websocket = { group = "org.java-websocket", name = "Java-WebSocket", version.ref = "websocket" }
tasker = { group = "com.joaomgcd", name = "taskerpluginlibrary", version.ref = "tasker" }
bouncycastle-pkix = { group = "org.bouncycastle", name = "bcpkix-jdk15to18", version.ref = "bouncycastle" }
bouncycastle-prov = { group = "org.bouncycastle", name = "bcprov-jdk15to18", version.ref = "bouncycastle" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
protobuf = { id = "com.google.protobuf", version.ref = "protobufPlugin" }

